<div class="hit-count" style="margin-bottom: 8px; font-weight: 600;">
  ヒット件数: {{ hitCount }} 件
</div>

<div class="table-wrap">
  <table class="table">

    <!-- テーブルヘッダー：一覧カラム -->
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th class="th-action">Cart</th>
      </tr>
    </thead>

    <!-- 商品リストの表示 -->
    <tbody>
      <tr *ngFor="let p of products">
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.category }}</td>

        <!-- 金額は通貨形式で表示 -->
        <td>{{ p.price | currency:'JPY':'symbol':'1.0-0' }}</td>

        <!-- カート操作ボタン -->
        <td class="td-action">
          <button class="btn btn--ghost cart-btn" [class.cart-btn--active]="isInCart(p.id)" (click)="onToggleCart(p.id)"
            title="Toggle Cart">
            {{ isInCart(p.id) ? '🛒' : '＋' }}
          </button>
        </td>
      </tr>
    </tbody>

  </table>
</div>
