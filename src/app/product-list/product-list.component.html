<div class="table-wrap">
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th class="th-action">Cart</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of products">
        <td>{{ p.id }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.category }}</td>
        <td>{{ p.price | currency:'JPY':'symbol':'1.0-0' }}</td>
        <td class="td-action">
          <button
            class="btn btn--ghost cart-btn"
            [class.cart-btn--active]="isInCart(p.id)"
            (click)="onClickToggle(p.id)"
            title="Toggle Cart">
            {{ isInCart(p.id) ? '🛒' : '＋' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
